# Builds the modified image for this fork and publishes it to GHCR.
# Changes from upstream are listed in HUILIU_CHANGES.md.
name: huiliu image

on:
  # Branch pushes only: any tag push would also fire the upstream docker,
  # electron and release workflows kept in this repository.
  push:
    branches: [huiliu/main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION="huiliu-$(date -u +'%Y%m%d')-${SHORT_SHA}"
          echo "${VERSION}" > VERSION
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner == 'BananaWong' && 'bananawong' || github.repository_owner }}/huiliu-api:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner == 'BananaWong' && 'bananawong' || github.repository_owner }}/huiliu-api:sha-${{ steps.v.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
